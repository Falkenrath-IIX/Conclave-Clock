[Rainmeter]
Update=1000
Author=HipHopium / Modified

[Variables]
FontDate=Bebas Neue
FontMonth=Montserrat
FontDay=Arial
FontTime=Montserrat
Scale=0.90


; 0 PENGATURAN WARNA & TRANSPARANSI (RGBA)

; Format: Red, Green, Blue, Alpha (0 = Transparan, 255 = Solid)
ColorText=255,255,255,255
ColorTime=255,255,255,180

[MeasureDate]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%B

[MeasureDay]
Measure=Time
Format=%A
StringCase=Upper
RegExpSubstitute=1
Substitute="(.)":"\1#CRLF##CRLF#"

[MeasureTimeSmall]
Measure=Time
Format=%I:%M %p

; 1. ANGKA TANGGAL BESAR (GRADASI FADE LEBIH TRANSPARAN)
[MeterDate]
Meter=String
MeasureName=MeasureDate
StringAlign=Center
FontColor=#ColorText#
FontSize=240
FontFace=#FontDate#
InlineSetting2=CharacterSpacing | -8 | -8
X=250
Y=0
AntiAlias=1
; Gradasi -90 derajat (Atas ke Bawah): 
; Top (Solid 255) -> Mid (Transparan 120 di 40%) -> Bottom (Transparan 0 di 85%)
InlineSetting=GradientColor | -90 | 255,255,255,255 ; 0.0 | 255,255,255,120 ; 0.4 | 255,255,255,0 ; 0.85
TransformationMatrix=#Scale#;0;0;#Scale#;0;0

; 2. TEKS BULAN
[MeterMonth]
Meter=String
MeasureName=MeasureMonth
StringAlign=Left
FontColor=#ColorText#
FontSize=30
FontFace=#FontMonth#
StringStyle=Bold
StringCase=Upper
InlineSetting=CharacterSpacing | 1 | 1
X=210
Y=180
AntiAlias=1
TransformationMatrix=#Scale#;0;0;#Scale#;0;0

; 3. JAM KECIL
[MeterTimeSmall]
Meter=String
MeasureName=MeasureTimeSmall
StringAlign=Left
FontColor=#ColorTime#
FontSize=13
FontFace=#FontTime#
StringStyle=Bold
StringCase=Upper
InlineSetting=CharacterSpacing | 0.5 | 0.5
X=215
Y=228
AntiAlias=1
TransformationMatrix=#Scale#;0;0;#Scale#;0;0

; 4. TEKS HARI VERTIKA
[MeterDay]
Meter=String
MeasureName=MeasureDay
StringAlign=Center
FontColor=#ColorText#
FontSize=8
FontFace=#FontDay#
StringStyle=Bold
InlineSetting=LineSpacing | 6
StringCase=Upper
ClipString=0
X=180
Y=190
AntiAlias=1
TransformationMatrix=#Scale#;0;0;#Scale#;0;0
